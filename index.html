<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Insight</title>
    <link rel="canonical" href="https://ticker-oracle-charm.lovable.app/" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #05080d;
        color: #f5f7fb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 20%, rgba(34, 197, 94, 0.18), transparent 28rem),
          linear-gradient(135deg, #05080d 0%, #0b1724 100%);
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1;
      }

      p {
        margin: 0 0 1.25rem;
        color: #a8b3c5;
        font-size: 1rem;
        line-height: 1.6;
      }

      a {
        color: #22c55e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Stock Insight</h1>
      <p>
        The live app is available below. If you opened the Lovable app, the full Stock Insight
        interface will load here.
      </p>
      <a href="https://ticker-oracle-charm.lovable.app/">Open live app</a>
    </main>
  </body>
</html>
