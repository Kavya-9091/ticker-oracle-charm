name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static app
        run: GITHUB_PAGES=true bun run build

      - name: Add GitHub Pages entry
        run: |
          cat > .output/public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Stock Insight</title>
              <meta http-equiv="refresh" content="0; url=https://ticker-oracle-charm.lovable.app/" />
              <link rel="canonical" href="https://ticker-oracle-charm.lovable.app/" />
              <script>
                window.location.replace("https://ticker-oracle-charm.lovable.app/");
              </script>
            </head>
            <body>
              <main>
                <h1>Stock Insight</h1>
                <p>Opening the live Stock Insight app.</p>
                <a href="https://ticker-oracle-charm.lovable.app/">Open live app</a>
              </main>
            </body>
          </html>
          HTML
          cp .output/public/index.html .output/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
